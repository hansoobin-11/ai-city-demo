name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-city-demo/package-lock.json

      - name: Build ai-city-demo
        working-directory: ai-city-demo
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/demo _site/exhibition
          cp -r ai-city-demo/dist/. _site/demo/
          # exhibition-ui는 빌드 없는 정적 파일 — 런타임에 필요한 src/, public/만 복사
          cp -r spacebank-ai-city-exhibition-ui/src spacebank-ai-city-exhibition-ui/public _site/exhibition/
          cp .github/pages/index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
